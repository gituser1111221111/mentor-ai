# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# The API key is a secret: Render asks for it during setup (sync: false). Never commit it.
services:
  - type: web
    name: mentor-ai
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: CHAT_LIMIT_PER_HOUR
        value: "40"
      - key: MENTOR_API_KEY
        sync: false
      # Market data for the investing agents. Set values in Render > Environment; never commit them.
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: ALPHA_VANTAGE_API_KEY
        sync: false
      # Voice credentials are retained for future use; voice and text chat are currently disabled.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_DEBT_FREE_COACH
        sync: false
